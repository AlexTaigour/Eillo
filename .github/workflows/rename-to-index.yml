name: Rename demo to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace empty index with demo file
        run: |
          rm -f index.html
          mv eillo-demo-website.html index.html
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Rename demo file to index.html"
          git push



















